<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ec4899">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pony-Hof der Zahlen</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --pink:#ec4899;--pink-d:#db2777;--pink-100:#fce7f3;--pink-50:#fdf2f8;
  --blue:#3b82f6;--blue-d:#2563eb;--blue-100:#dbeafe;--blue-50:#eff6ff;--blue-900:#1e3a8a;
  --green:#22c55e;--green-d:#16a34a;--green-100:#dcfce7;--green-900:#14532d;
  --amber-100:#fef3c7;--amber-200:#fde68a;--amber-800:#92400e;
  --purple-100:#f3e8ff;--purple-900:#581c87;--orange-100:#ffedd5;--orange-900:#7c2d12;
  --s50:#f8fafc;--s100:#f1f5f9;--s200:#e2e8f0;--s300:#cbd5e1;--s400:#94a3b8;--s500:#64748b;--s600:#475569;--s800:#1e293b;
  --yellow-100:#fef9c3;--yellow-300:#fde047;--yellow-800:#854d0e;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--s50);color:var(--s800);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font-family:inherit;border:0;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
input{font-family:inherit}
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:16px 12px 40px;animation:fade .35s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.up{animation:up .4s ease-out}
.center{justify-content:center;text-align:center}
h1{font-size:1.9rem;color:var(--blue-900);margin:.4em 0}
h2{font-size:1.5rem;margin:.3em 0}
h3{font-size:1.1rem;margin:.6em 0 .4em}
p{line-height:1.45}
.card{background:#fff;border-radius:24px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--s100);padding:16px;width:100%;max-width:640px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:14px 26px;font-size:1.15rem;font-weight:800;transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn-pink{background:var(--pink);color:#fff;box-shadow:0 4px 12px rgba(236,72,153,.3)}
.btn-blue{background:var(--blue);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-soft{background:#fff;border:2px solid var(--s200);color:var(--s600)}
.btn-amber{background:#fff;border:2px solid var(--amber-200);color:var(--amber-800)}
.btn-sm{padding:8px 16px;font-size:.95rem}
.iconbtn{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;color:var(--s400)}
.iconbtn svg{width:24px;height:24px}
.topleft{position:absolute;top:10px;left:10px;z-index:5}
.topright{position:absolute;top:10px;right:10px;z-index:5}
.pony{width:88px;height:88px;flex-shrink:0}
.pony.big{width:120px;height:120px}
.pony.sm{width:64px;height:64px}
.row{display:flex;align-items:center;gap:14px}
.field{width:100%;max-width:360px;text-align:left}
.field label{font-weight:700;color:var(--s600);margin-left:6px}
.field input{width:100%;padding:14px;border-radius:18px;border:2px solid var(--pink-100);font-size:1.2rem;margin-top:6px}
.field input:focus{outline:2px solid var(--pink)}
.choice{display:flex;gap:18px}
.choice button{background:#fff;border-radius:24px;padding:14px;border:4px solid transparent;opacity:.7;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;color:var(--s600)}
.choice button.sel{border-color:var(--pink);opacity:1;transform:scale(1.04)}
.stars{display:inline-flex;align-items:center;gap:6px;background:var(--pink-100);color:var(--pink-d);font-weight:800;padding:5px 12px;border-radius:999px;font-size:.95rem;margin-top:6px}
.stars svg{width:16px;height:16px;fill:currentColor}
.exgrid{display:grid;grid-template-columns:1fr;gap:10px;width:100%;max-width:640px}
@media(min-width:560px){.exgrid{grid-template-columns:1fr 1fr}}
.ex{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;font-size:1.15rem;font-weight:800;text-align:left}
.ex .ico{width:48px;height:48px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0}
.ex .ico svg{width:30px;height:30px}
.ex.count{background:var(--blue-100);color:var(--blue-900)}
.ex.friends10{background:var(--purple-100);color:var(--purple-900)}
.ex.plus{background:var(--green-100);color:var(--green-900)}
.ex.minus{background:var(--orange-100);color:var(--orange-900)}
.locked{background:var(--amber-100);border:2px solid var(--amber-200);border-radius:24px;padding:24px;text-align:center;max-width:420px;color:var(--amber-800)}
/* play */
.bubblewrap{display:flex;align-items:flex-start;gap:10px;width:100%;max-width:640px;margin-top:52px;background:#fff;border-radius:24px;padding:12px;border:1px solid var(--blue-100)}
.bubble{position:relative;flex:1;background:var(--blue-50);border-radius:18px;border-top-left-radius:4px;padding:12px 12px;display:flex;align-items:center;gap:8px;margin-top:8px;min-height:64px}
.bubble p{margin:0;font-weight:800;color:var(--blue-900);font-size:1.05rem;flex:1}
.bubble .iconbtn{width:40px;height:40px;color:var(--blue)}
.banner{background:var(--amber-200);color:var(--amber-800);font-weight:800;padding:8px 16px;border-radius:999px;font-size:.9rem;margin-top:6px;animation:up .4s}
.frame{background:#fff;border-radius:20px;padding:10px;margin-top:14px;border:1px solid var(--s100);display:flex;flex-direction:column;gap:6px}
.frow{display:flex;gap:4px}
.slot{--sz:min(calc((100vw - 64px) / 10.6),44px);width:var(--sz);height:var(--sz);border:2px solid var(--s200);border-radius:8px;position:relative;padding:3px;transition:transform .25s,box-shadow .25s;background:#fff}
.slot:nth-child(5){margin-right:10px}
.slot.base,.slot.add,.slot.sub{border-color:#93c5fd;background:var(--blue-50)}
.slot svg{width:100%;height:100%;display:block}
.slot .x{position:absolute;inset:0;padding:2px;color:rgba(100,116,139,.75)}
.slot.hl{transform:scale(1.15);box-shadow:0 0 0 4px var(--pink);background:var(--pink-100);z-index:2}
.slot .cnum{display:none;position:absolute;top:-22px;left:50%;transform:translateX(-50%);background:#fff;color:var(--pink-d);font-weight:900;font-size:.85rem;padding:1px 8px;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.slot.hl .cnum{display:block}
.nline{width:100%;max-width:640px;background:#fff;border-radius:16px;border:1px solid var(--s100);margin-top:16px;padding:14px 14px 30px;position:relative}
.nline .rail{height:4px;background:var(--s300);border-radius:2px;position:absolute;left:14px;right:14px;top:22px}
.ticks{display:flex;justify-content:space-between;position:relative}
.tick{display:flex;flex-direction:column;align-items:center;position:relative;width:12px}
.tick i{display:block;width:3px;height:12px;background:var(--s300);border-radius:2px;margin-top:4px}
.tick.big i{background:var(--s500);height:16px;margin-top:0}
.tick .lbl{position:absolute;top:24px;font-size:.78rem;font-weight:800;color:var(--s400);transition:transform .15s}
.tick.big .lbl{color:var(--s600)}
.tick.active .lbl{color:var(--pink-d);background:var(--pink-100);padding:0 6px;border-radius:999px;font-size:1rem;transform:scale(1.2)}
@media(max-width:480px){.nline.nl20 .tick.odd .lbl{display:none}}
.answer{width:110px;height:58px;background:#fff;border:4px solid var(--blue-100);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:900;margin-top:14px;box-shadow:inset 0 2px 4px rgba(0,0,0,.06)}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:260px;margin-top:14px}
.key{height:54px;border-radius:16px;font-size:1.5rem;font-weight:800;background:var(--blue-50);color:var(--blue-900);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.key:active{transform:scale(.95)}
.key.del{background:var(--s100);color:var(--s600)}
.key.ok{background:var(--green);color:#fff}
.key svg{width:28px;height:28px}
.feedback{margin-top:14px;padding:14px;border-radius:22px;display:flex;align-items:center;gap:10px;max-width:560px;width:100%;font-weight:800;font-size:1.05rem;animation:up .35s}
.feedback.ok{background:var(--green-100);color:var(--green-900);border:2px solid #86efac}
.feedback.no{background:var(--yellow-100);color:var(--yellow-800);border:2px solid var(--yellow-300)}
.feedback svg.star{width:34px;height:34px;fill:#facc15;color:#facc15;flex-shrink:0}
/* reward */
.farm{width:100%;max-width:560px;border-radius:24px;overflow:hidden;border:8px solid #86efac;box-shadow:inset 0 2px 8px rgba(0,0,0,.08)}
.farm svg{display:block;width:100%;height:auto}
.newbox{margin-top:16px;background:#fff;padding:14px;border-radius:22px;border:2px solid var(--yellow-300);text-align:center;max-width:420px;width:100%}
.newbox .item{font-size:1.5rem;font-weight:900;color:var(--pink-d)}
/* parents */
.pwrap{width:100%;max-width:980px}
.pgrid{display:grid;grid-template-columns:1fr;gap:16px;width:100%}
@media(min-width:760px){.pgrid{grid-template-columns:1fr 1fr}}
.pcard{background:#fff;border-radius:22px;border:1px solid var(--s100);padding:18px;display:flex;flex-direction:column;gap:14px}
.pcard label{font-size:.85rem;font-weight:800;color:var(--s600);display:block;margin-bottom:6px}
.pcard input[type=range]{width:100%;accent-color:var(--pink)}
.seg{display:flex;gap:10px}
.seg button{flex:1;padding:10px;border-radius:14px;font-weight:800;border:2px solid var(--s200);background:#fff;color:var(--s500)}
.seg button.sel{border-color:var(--pink);background:var(--pink-50);color:var(--pink-d)}
.toggle{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--s600)}
.toggle input{width:22px;height:22px;accent-color:var(--pink)}
.sub{background:var(--s50);border:1px solid var(--s100);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.small{font-size:.78rem;color:var(--s400);line-height:1.35}
.pbtn{width:100%;padding:10px;border-radius:14px;font-weight:800;font-size:.95rem}
.pbtn.blue{background:var(--blue-100);color:var(--blue-900)}
.pbtn.purple{background:var(--purple-100);color:var(--purple-900)}
.pbtn.grey{background:var(--s100);color:var(--s600)}
.pbtn.red{background:#fee2e2;color:#991b1b}
.pbtn.green{background:var(--green-100);color:var(--green-900)}
.pinbox{display:flex;gap:8px}
.pinbox input{flex:1;padding:10px;border:2px solid var(--s200);border-radius:12px;font-size:1.1rem;text-align:center;letter-spacing:.3em}
.statrow{display:flex;justify-content:space-between;font-size:.9rem;margin-top:8px}
.bar{height:8px;background:var(--s200);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--s100);color:var(--s600);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:800}
.chip b{color:var(--s400);font-weight:600}
.cols{display:flex;align-items:flex-end;gap:4px;height:90px;border-bottom:2px solid var(--s200);padding-bottom:0}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.col i{display:block;width:70%;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px}
.col span{position:absolute;bottom:-18px;font-size:.6rem;color:var(--s400);white-space:nowrap}
.col em{position:absolute;top:-4px;font-size:.6rem;font-style:normal;color:var(--s500)}
.errlist div{padding:8px 4px;border-bottom:1px solid var(--s100);font-size:.85rem;display:flex;justify-content:space-between;align-items:center}
.errlist .meta{font-size:.7rem;color:var(--s400)}
.pinscreen{background:#fff;padding:32px;border-radius:24px;max-width:340px;width:100%;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.pinscreen input{width:100%;text-align:center;font-size:1.6rem;letter-spacing:.4em;padding:14px;border:2px solid var(--s200);border-radius:14px;margin:10px 0}
.pinscreen input.err{border-color:#f87171}
.errmsg{color:#b91c1c;font-size:.85rem;font-weight:700}
.scrollbox{max-height:70vh;overflow:auto;padding-right:4px}
.breathe{animation:breathe 2.5s ease-in-out infinite}
.petbtn{background:none;padding:0;border-radius:50%;position:relative;display:inline-block;-webkit-tap-highlight-color:transparent}
.petbtn .pony{display:block;transition:transform .2s}
.petbtn:active .pony{transform:scale(.96)}
@keyframes nuzzle{0%{transform:rotate(0) scale(1)}25%{transform:rotate(-7deg) scale(1.06)}55%{transform:rotate(6deg) scale(1.08)}80%{transform:rotate(-3deg) scale(1.04)}100%{transform:rotate(0) scale(1)}}
.petbtn.pet .pony{animation:nuzzle 1s ease-in-out}
.heartfx{position:absolute;left:50%;top:15%;width:22px;height:22px;pointer-events:none;animation:floatup 1.5s ease-out forwards}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-95px) scale(1.15)}}
.backover{position:fixed;inset:0;background:var(--pink-50);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:fade .3s}
.backover h2{color:var(--pink-d);margin:14px 0 6px}
.backover p{color:var(--s600);font-weight:700;max-width:340px;margin:0 0 22px}
.pethint{font-size:.85rem;color:var(--s400);margin-top:4px}
</style>
</head>

/* ================= Statistik ================= */
function recordResult(t, correct, given) {
  var spent = Math.min(120, Math.max(1, Math.round((Date.now() - S.taskShownAt) / 1000)));
  var key = t.type + '_' + t.range;
  var sr = stats.successRates[key] || { correct: 0, total: 0 };
  sr.total += 1; if (correct) sr.correct += 1; stats.successRates[key] = sr;
  if (t.crossesTen) { stats.crossTen.total += 1; if (correct) stats.crossTen.correct += 1; }
  var dk = dayKey(); var d = stats.daily[dk] || { c: 0, w: 0, s: 0 };
  if (correct) d.c += 1; else d.w += 1; d.s += spent; stats.daily[dk] = d;
  stats.playtimeTotal = (stats.playtimeTotal || 0) + spent;
  if (!correct) {
    stats.errors.unshift({ date: new Date().toISOString(), type: t.type, task: taskLabel(t), given: given, range: t.range, crossesTen: t.crossesTen });
    if (stats.errors.length > 200) stats.errors.length = 200;
  }
  var keys = Object.keys(stats.daily).sort();
  while (keys.length > 120) delete stats.daily[keys.shift()];
  saveStats();
}

/* ================= Session / Zeit ================= */
setInterval(function () {
  if (!S.sessionStart || (S.screen !== 'play' && S.screen !== 'break')) return;
  var elapsed = Math.floor((Date.now() - S.sessionStart) / 1000);
  var limit = settings.sessionLimitMinutes * 60;
  var warnAt = limit - (limit < 180 ? 60 : 120);
  if (!S.warned && elapsed >= warnAt && elapsed < limit) {
    S.warned = true;
    var b = document.getElementById('banner'); if (b) b.style.display = 'block';
    if (!S.shared && !S.feedback) TTS.speak('Noch kurze Zeit, dann darf ' + user.companionName + ' auf die Weide!', S.token);
  }
  if (elapsed >= limit) S.expired = true;
}, 2000);

function endSession() {
  var elapsed = S.sessionStart ? Math.floor((Date.now() - S.sessionStart) / 1000) : 0;
  stats.sessions.push({ date: new Date().toISOString(), duration: elapsed, tasks: S.tasksInSession, correct: S.sessionCorrect, wrong: S.sessionWrong });
  if (stats.sessions.length > 100) stats.sessions.shift();
  saveStats();
  user.sessionLocked = true; saveUser();
  S.sessionStart = null; S.expired = false; S.warned = false;
  go('sessionEnd');
  TTS.speak('Das war eine tolle Übungszeit, ' + user.childName + '! Dein ' + companionWord() + ' ' + user.companionName + ' freut sich schon auf morgen.', S.token);
}

/* ================= Antwort prüfen ================= */
/* Spricht den Text und wartet, bis die Sprachausgabe fertig ist (mindestens minMs), plus eine kurze Nachpause. */
function afterSpeech(text, token, minMs, pauseMs) {
  var started = Date.now();
  return TTS.speak(text, token).then(function () {
    var rest = Math.max(0, minMs - (Date.now() - started)) + (pauseMs || 0);
    return new Promise(function (r) { S.timer = setTimeout(r, rest); });
  });
}
function checkAnswer() {
  var t = S.task; if (!t || S.feedback) return;
  var n = parseInt(S.input, 10); if (isNaN(n)) return;
  var token = S.token;

  if (n === t.answer) {
    recordResult(t, true, n);
    successSound();
    var pw = pick(PRAISE), praise = praiseText(t, false, pw), praiseSpoken = praiseText(t, true, pw);
    var newStreak = user.streak > 0 ? user.streak + 1 : 1;
    var newMax = user.adaptiveMax;
    if (newStreak % 5 === 0) {
      var cand = Math.min(settings.maxNumber, stepUp(user.adaptiveMax));
      if (cand > user.adaptiveMax) { newMax = cand; praise += ' Du bist bereit für die große Wiese!'; praiseSpoken += ' Du bist bereit für die große Wiese!'; }
    }
    user.stars += 1; user.streak = newStreak; user.adaptiveMax = newMax; saveUser();
    S.tasksInSession += 1; S.sessionCorrect += 1;
    S.feedback = { ok: true, msg: praise };
    renderPlay();
    var starsNow = user.stars;
    afterSpeech(praiseSpoken, token, 2600, 700).then(function () {
      if (token.cancelled) return;
      if (S.expired) { endSession(); return; }
      if (starsNow % 3 === 0) { user.farmLevel += 1; saveUser(); S.levelUp = true; go('reward'); return; }
      if (S.tasksInSession % 10 === 0) { go('break'); return; }
      newTask(S.taskType);
    });
  } else {
    recordResult(t, false, n);
    S.sessionWrong += 1;
    S.errorCount += 1;
    var st = user.streak > 0 ? -1 : user.streak - 1;
    if (st <= -3) { user.adaptiveMax = stepDown(user.adaptiveMax); st = 0; }
    user.streak = st; saveUser();
    if (S.errorCount >= 2) { sharedCounting(token); }
    else {
      var msg = 'Schau noch mal genau hin. Du schaffst das!';
      S.feedback = { ok: false, msg: msg }; renderPlay();
      afterSpeech(msg, token, 2200, 500).then(function () { if (token.cancelled) return; S.input = ''; S.feedback = null; renderPlay(); });
    }
  }
}

function sharedCounting(token) {
  var t = S.task;
  S.shared = true; S.sharedIndex = -1;
  S.feedback = { ok: false, msg: 'Schau, es ' + (t.answer === 1 ? 'ist ' : 'sind ') + t.answer + '. Komm, wir zählen zusammen!' };
  renderPlay();
  var seq = Promise.resolve().then(function () { return TTS.speak(S.feedback.msg, token); });
  var loop = function (k) {
    return function () {
      if (token.cancelled) return Promise.reject('cancel');
      S.sharedIndex = k; updateShared();
      return TTS.speak(NUMWORDS[k + 1], token);
    };
  };
  for (var k = 0; k < t.answer; k++) seq = seq.then(loop(k));
  seq.then(function () {
    if (token.cancelled) return Promise.reject('cancel');
    S.sharedIndex = -1; updateShared();
    S.input = String(t.answer); updateInput();
    return TTS.speak(amount(t.answer, t.type === 'friends10' ? t.obj2 : t.obj, true) + '! Jetzt weißt du es.', token);
  }).then(function () {
    if (token.cancelled) return;
    return new Promise(function (r) { S.timer = setTimeout(r, 1200); });
  }).then(function () {
    if (token.cancelled) return;
    if (S.expired) { endSession(); return; }
    newTask(S.taskType, stepDown(t.range) === t.range ? t.range : stepDown(t.range));
  }).catch(function () {});
}

/* ================= Rendering ================= */
function render() {
  try {
    switch (S.screen) {
      case 'setup': renderSetup(); break;
      case 'menu': renderMenu(); break;
      case 'play': renderPlay(); break;
      case 'reward': renderReward(); break;
      case 'break': renderBreak(); break;
      case 'sessionEnd': renderSessionEnd(); break;
      case 'parents': renderParents(); break;
      default: renderMenu();
    }
  } catch (e) { renderError(e); }
}
function renderError(e) {
  APP.innerHTML = '<div class="screen center"><svg class="pony big"><use href="#i-ponyhead"/></svg><h2>Huch! Da ist etwas schiefgelaufen.</h2><p class="small">' + esc(e && e.message) + '</p><button class="btn btn-pink" id="reload">Neu starten</button></div>';

}

/* ---------- Aufgabe ---------- */
function frameHTML(t) {
  var slots = t.range <= 10 ? 10 : 20, html = '<div class="frame" id="frame">';
  for (var r = 0; r < slots / 10; r++) {
    html += '<div class="frow">';
    for (var i = r * 10; i < r * 10 + 10; i++) {
      var st = slotState(t, i), inner = '';
      if (st === 'base') inner = icon(t.obj.id);
      else if (st === 'add') inner = icon(t.obj2.id);
      else if (st === 'sub') inner = icon(t.obj.id) + icon('cross', 'x');
      html += '<div class="slot ' + st + '" data-i="' + i + '">' + inner + '<span class="cnum"></span></div>';
    }
    html += '</div>';
  }
  return html + '</div>';
}
function lineHTML(range) {
  var html = '<div class="nline nl' + range + '" id="nline"><div class="rail"></div><div class="ticks">';
  for (var i = 0; i <= range; i++) html += '<div class="tick ' + (i % 5 === 0 ? 'big' : '') + (i % 2 ? ' odd' : '') + '" data-n="' + i + '"><i></i><span class="lbl">' + i + '</span></div>';
  return html + '</div></div>';
}
function renderPlay() {
  var t = S.task; if (!t) { APP.innerHTML = ''; return; }
  var fb = S.feedback, busy = !!fb;
  var bubbleText = S.shared ? fb.msg : questionText(t, false);
  var keys = '';
  for (var k = 1; k <= 9; k++) keys += '<button class="key" data-k="' + k + '">' + k + '</button>';
  keys += '<button class="key del" data-k="del">' + icon('cross') + '</button><button class="key" data-k="0">0</button><button class="key ok" data-k="ok" id="ok">' + icon('check') + '</button>';
  APP.innerHTML =
    '<div class="screen" style="position:relative">' +
    (S.shared ? '' : '<button class="iconbtn topleft" id="home" aria-label="Zurück">' + icon('home') + '</button>') +
    '<div class="banner" id="banner" style="display:' + (S.warned ? 'block' : 'none') + '">Bald gibt\'s eine Pause auf der Weide!</div>' +
    '<div class="bubblewrap">' + ponyHTML() + '<div class="bubble"><p id="q">' + esc(bubbleText) + '</p>' + (S.shared ? '' : '<button class="iconbtn" id="say" aria-label="Nochmal vorlesen">' + icon('speaker') + '</button>') + '</div></div>' +
    frameHTML(t) + (settings.showNumberLine ? lineHTML(t.range) : '') +
    '<div class="answer" id="answer">' + (S.input || '?') + '</div>' +
    (busy ? '' : '<div class="numpad">' + keys + '</div>') +
    (fb && !S.shared ? '<div class="feedback ' + (fb.ok ? 'ok' : 'no') + '">' + (fb.ok ? icon('star', 'star') : ponyHTML(null, 'sm')) + '<span>' + esc(fb.msg) + '</span></div>' : '') +
    '</div>';
  on('#home', 'click', function () { go('menu'); });
  on('#say', 'click', function () { TTS.speak(questionText(t, true), S.token); });
  on('.key', 'click', function (ev) {
    if (S.feedback) return;
    var k = ev.currentTarget.getAttribute('data-k');
    if (k === 'del') S.input = S.input.slice(0, -1);
    else if (k === 'ok') { checkAnswer(); return; }
    else if (S.input.length < 2) S.input += k;
    updateInput();
  });
  updateInput(); updateShared();
}
function updateInput() {
  var a = document.getElementById('answer'); if (a) a.textContent = S.input || '?';
  var ok = document.getElementById('ok'); if (ok) ok.disabled = !S.input;
  var n = S.input === '' ? -1 : parseInt(S.input, 10);
  var ticks = APP.querySelectorAll('.tick'); for (var i = 0; i < ticks.length; i++) ticks[i].classList.toggle('active', parseInt(ticks[i].getAttribute('data-n'), 10) === n);
}
function updateShared() {
  var t = S.task; if (!t) return;
  var slots = APP.querySelectorAll('.slot'); var target = S.sharedIndex < 0 ? -1 : sharedSlot(t, S.sharedIndex);
  for (var i = 0; i < slots.length; i++) {
    var hit = parseInt(slots[i].getAttribute('data-i'), 10) === target;
    slots[i].classList.toggle('hl', hit); if (hit) slots[i].querySelector('.cnum').textContent = S.sharedIndex + 1;
  }
  if (S.sharedIndex >= 0) {
    var ticks = APP.querySelectorAll('.tick'); for (var j = 0; j < ticks.length; j++) ticks[j].classList.toggle('active', parseInt(ticks[j].getAttribute('data-n'), 10) === S.sharedIndex + 1);
  }
}

/* ---------- Eltern-Bereich ---------- */
function weekStart(d) { d = new Date(d.getFullYear(), d.getMonth(), d.getDate()); var day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); return d; }
function fmtDM(d) { return d.getDate() + '.' + (d.getMonth() + 1) + '.'; }
function analysis() {
  var today = new Date(), weeks = [], days = [];
  var ws = weekStart(today);
  for (var w = 7; w >= 0; w--) {
    var st = new Date(ws); st.setDate(st.getDate() - 7 * w); var c = 0, wr = 0;
    for (var i = 0; i < 7; i++) { var d = new Date(st); d.setDate(d.getDate() + i); var e = stats.daily[dayKey(d)]; if (e) { c += e.c; wr += e.w; } }
    weeks.push({ label: fmtDM(st), total: c + wr, rate: (c + wr) ? Math.round(100 * wr / (c + wr)) : null });
  }
  for (var k = 13; k >= 0; k--) { var dd = new Date(today); dd.setDate(dd.getDate() - k); var en = stats.daily[dayKey(dd)]; days.push({ label: fmtDM(dd), min: en ? Math.round(en.s / 60) : 0 }); }
  var counts = {}; stats.errors.forEach(function (e) { counts[e.task] = (counts[e.task] || 0) + 1; });
  var top = Object.keys(counts).map(function (k) { return [k, counts[k]]; }).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 10);
  return { weeks: weeks, days: days, top: top };
}

  APP.innerHTML =

    '<div class="toggle" style="border-top:1px solid var(--s200);padding-top:10px"><span>Fokus-Modus</span><input type="checkbox" id="focus" ' + (settings.focusMode ? 'checked' : '') + '></div><p class="small" style="margin:0">Öffnet die Übung im Vollbild und zeigt beim Zurückkommen einen Begrüßungs-Bildschirm, wenn die App zwischendurch verlassen wurde. <b>Wichtig:</b> Der Home-Button lässt sich technisch nicht sperren – dafür bitte das Anheften des Bildschirms nutzen (Anleitung unten).</p>' +

/* ================= Start ================= */
function init() {
  var today = new Date().toDateString();
  if (user.lastPlayed !== today) { user.sessionLocked = false; user.lastPlayed = today; saveUser(); }
  var ready = user.childName && user.gender && user.companionType && user.companionName;
  try { history.replaceState({ screen: 'root' }, ''); } catch (e) {}
  go(ready ? 'menu' : 'setup', { noPush: true });
}
try { init(); } catch (e) { renderError(e); }

/* Service Worker */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./service-worker.js').catch(function () {}); });
}
})();
